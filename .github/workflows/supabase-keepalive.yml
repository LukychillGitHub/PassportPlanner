# El plan gratis de Supabase pausa el proyecto tras 7 días sin actividad.
# Esta tarea hace una consulta liviana cada 3 días para que nunca llegue a
# pausarse. Si la consulta falla, la tarea falla y GitHub manda un mail.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://tordvdesfpgahqhyvrxh.supabase.co
      # Es la misma clave pública (anon) que ya viaja dentro de la app
      # (src/lib/supabase.ts); sin sesión, las reglas de seguridad no le
      # dejan leer ningún dato.
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcmR2ZGVzZnBnYWhxaHl2cnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTY0NzcsImV4cCI6MjEwNDA5MjQ3N30.rUeK2wGco85Znj9LezwdeQL9097HjoC0hRVXboVu7m4
    steps:
      - name: Consultar la base de datos
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/passports?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Respuesta de Supabase: HTTP $status"
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase respondió HTTP $status. Si el proyecto quedó pausado, reactivalo desde el panel de Supabase (Restore project)."
            exit 1
          fi
